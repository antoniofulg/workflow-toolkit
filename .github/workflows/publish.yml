name: Publish package

on:
  release:
    types: [published]

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out published release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Validate release identity
        run: node scripts/validate-release.mjs

      - name: Install npm CLI
        run: npm install --global npm@11.5.1 --no-audit --no-fund

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Run the full test gate
        run: bun run test:all

      - name: Publish to npm
        run: npm publish --provenance --access public --tag latest --registry=https://registry.npmjs.org
